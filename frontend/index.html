<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mockea-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>MOCKEA</title>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            var reg = registrations[i];
            var url = (reg.active || reg.installing || reg.waiting || {}).scriptURL || '';
            if (url.indexOf('sw.js') !== -1 && url.indexOf('firebase-messaging-sw.js') === -1) {
              reg.unregister().then(function(unregistered) {
                if (unregistered) {
                  console.log('Unregistered broken service worker:', url);
                  window.location.reload();
                }
              });
            }
          }
        });
      }
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-bc antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
